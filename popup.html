<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
    }
    p.sub {
      font-size: 12px;
      color: #666;
      margin: 0 0 14px;
    }
    label.field {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin: 0 0 5px;
    }
    select {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      box-sizing: border-box;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
      color: #333;
    }
    .check label { margin: 0; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #c2410c;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #9a3412; }
    button:disabled { background: #d6a48a; cursor: default; }
    #status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
      color: #444;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>ClipNotes</h1>
  <p class="sub">Riassunto del video aperto, in italiano.</p>

  <label class="field" for="style">Tipo di riassunto</label>
  <select id="style">
    <option value="titoli">Titoli + paragrafo (panoramica)</option>
    <option value="punti">Punti chiave (elenco)</option>
    <option value="studio">Schema di studio</option>
    <option value="tldr">TL;DR (ultra breve)</option>
    <option value="semplice">Spiegazione semplice</option>
    <option value="domande">Domande e risposte</option>
    <option value="traduci">Traduci tutto il testo (no riassunto)</option>
  </select>

  <div class="check">
    <input type="checkbox" id="takeaway">
    <label for="takeaway">Aggiungi take-away finali</label>
  </div>

  <button id="go">Riassumi questo video</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
